name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: pytest -q

  migrations:
    name: Migraciones (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: match_user
          POSTGRES_PASSWORD: match_pass
          POSTGRES_DB: match_analisis
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Los tests corren sobre SQLite con create_all, así que las migraciones
      # sólo se ejercitan acá: contra el motor real y en las dos direcciones.
      - name: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://match_user:match_pass@localhost:5432/match_analisis
          SECRET_KEY: ci-secret
          SUPERADMIN_EMAIL: root@example.com
          SUPERADMIN_PASSWORD: ci-password
        run: alembic upgrade head

      - name: alembic downgrade base
        env:
          DATABASE_URL: postgresql+asyncpg://match_user:match_pass@localhost:5432/match_analisis
          SECRET_KEY: ci-secret
          SUPERADMIN_EMAIL: root@example.com
          SUPERADMIN_PASSWORD: ci-password
        run: alembic downgrade base

  frontend:
    name: Frontend (tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npx vite build
